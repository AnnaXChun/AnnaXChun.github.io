name: Portfolio Pages
on:
  push:
    branches: [main]
    paths: ['pages-site/**', '.github/workflows/portfolio-pages.yml']
  pull_request:
    paths: ['pages-site/**', '.github/workflows/portfolio-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pages-site/package-lock.json
      - run: npm --prefix pages-site ci
      - name: Verify retained sports choreography and runtime
        run: node --test pages-site/test/badminton.test.mjs pages-site/test/scene-runtime.test.mjs pages-site/test/story-motion.test.mjs
      - run: npm --prefix pages-site run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-pages
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
